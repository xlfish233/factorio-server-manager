on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*.*'
  pull_request:
    branches:
      - '**'
env:
  factorio_password: ${{ secrets.FACTORIO_PASSWORD }}
  factorio_username: ${{ secrets.FACTORIO_USERNAME }}
  FSM_MODPACK_DIR: 'dev_pack'
  FSM_DIR: '../'
  FSM_CONF: '../../conf.toml.example'
jobs:
  test-npm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
      - run: make app/bundle
  test-rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: test-rust (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo build and test
        run: |
          cargo build --locked
          cargo test --all --locked
  docker-push:
    needs:  [test-npm, test-rust]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    steps:
      - uses: actions/checkout@v3
      - uses: rlespinasse/github-slug-action@v3.x
      - uses: docker/setup-buildx-action@v3
      - name: Login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ofsm/ofsm:${{ env.GITHUB_REF_SLUG }}
